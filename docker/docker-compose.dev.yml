version: '3.8'

services:
  print-ease-backend:
    build:
      context: ../PrintEase-backend
      dockerfile: Dockerfile.dev
    container_name: printease-backend
    environment:
      NODE_ENV: development
      DB_HOST: mpay-mysql
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: mpay7890
      DB_DATABASE: print_ease
      # Redis (待办，后续迭代)
      # REDIS_HOST: redis
      # REDIS_PORT: 6379
    ports:
      - "3000:3000"
    volumes:
      - ../PrintEase-backend:/app
      - /app/node_modules
      - ../uploads:/app/uploads
      - ../logs:/app/logs
    networks:
      - printease-network
      - mpay_mpay-network
    command: npm run start:dev

  print-ease-admin:
    build:
      context: ../PrintEase-admin
      dockerfile: Dockerfile.dev
    container_name: printease-admin
    ports:
      - "5173:5173"
    volumes:
      - ../PrintEase-admin:/app
      - /app/node_modules
    networks:
      - printease-network
    command: npm run dev -- --host

  # Redis (待办，后续迭代再启用)
  # redis:
  #   image: redis:7-alpine
  #   container_name: printease-redis
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis-data:/data
  #   networks:
  #     - printease-network

networks:
  printease-network:
    driver: bridge
  mpay_mpay-network:
    external: true

volumes:
  # redis-data: (待办)
